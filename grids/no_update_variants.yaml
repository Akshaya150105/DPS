# Section 6.3: No-update attack variants on en500 and lu500
# Compares the three Section 6.3 attack variants:
#   no_update      – full snapshot, volume filter (baseline)
#   no_update_pvia – partial snapshot (alpha=0.5) ranked by volume overlap
#   no_update_lvia – only snapshot keyword-count distribution, no volumes
# tau=24, lambda=120000, gamma=0.1, T1 equality
# LVIA is expected to weaken here because update diversity cannot be used
# (see Patch 15b docstring).
dataset:
  - lu500
  - lu1000
attack:
  - no_update
  - no_update_pvia
  - no_update_lvia
tau:
  - 10
lambda:
  - 500
gamma:
  - 0.1
alpha:
  - 0.5
eta:
  - 0.5
noise:
  - 0.0
equality:
  - T1
